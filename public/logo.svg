<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="podachi_bg" x1="28" y1="28" x2="228" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="50%" stop-color="#113329" />
      <stop offset="100%" stop-color="#081A14" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emerald_glow" x1="60" y1="60" x2="196" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Warm Ivory Gradient -->
    <linearGradient id="ivory_grad" x1="128" y1="50" x2="128" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2EBE6" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="logo_shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#040D0A" flood-opacity="0.6" />
    </filter>

    <radialGradient id="inner_light" cx="128" cy="80" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="216" height="216" rx="54" fill="url(#podachi_bg)" filter="url(#logo_shadow)" />
  <rect x="20" y="20" width="216" height="216" rx="54" fill="url(#inner_light)" />
  <rect x="21" y="21" width="214" height="214" rx="53" stroke="url(#emerald_glow)" stroke-width="2" stroke-opacity="0.35" />

  <!-- Modern Majestic Livestock Horns (Left Horn) -->
  <path
    d="M128 116 C122 84 96 58 64 62 C46 64 42 78 52 90 C66 106 88 114 98 134 C106 150 106 172 128 190"
    stroke="url(#emerald_glow)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Modern Majestic Livestock Horns (Right Horn) -->
  <path
    d="M128 116 C134 84 160 58 192 62 C210 64 214 78 204 90 C190 106 168 114 158 134 C150 150 150 172 128 190"
    stroke="url(#ivory_grad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stylized Head & Muzzle Shield -->
  <path
    d="M104 126 C104 116 114 108 128 108 C142 108 152 116 152 126 C152 148 140 178 128 184 C116 178 104 148 104 126 Z"
    fill="url(#ivory_grad)"
  />

  <!-- Digital Growth Leaf / Apex Star at Forehead -->
  <path
    d="M128 72 C132 82 138 88 148 92 C138 96 132 102 128 112 C124 102 118 96 108 92 C118 88 124 82 128 72 Z"
    fill="#34D399"
  />

  <!-- Digital Node Accent in Muzzle -->
  <circle cx="128" cy="148" r="4.5" fill="#113329" />
  
  <!-- Subtle Horizon Base Bar -->
  <path d="M112 172 L144 172" stroke="#113329" stroke-width="3" stroke-linecap="round" />
</svg>
